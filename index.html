const outline=[{"title": "第一章 糖的化学", "items": ["1.糖的基本概念与组成。", "2.重要多糖的结构与功能。", "3.糖类药物研究与应用。"]}, {"title": "第二章 脂类的化学", "items": ["1.脂类的概述、分类及生物学作用。", "2.单脂的化学。", "3.复合脂类的化学。", "4.脂类的提取分离与分析。", "5.脂类药物的研究与应用。"]}, {"title": "第三章 维生素", "items": ["1.维生素的定义、命名及分类概述。", "2.脂溶性维生素。", "3.水溶性维生素。"]}, {"title": "第四章 蛋白质的化学", "items": ["1.蛋白质的元素组成及元素组成特点：蛋白质平均含氮量为16％。", "2.蛋白质组成的基本单位——氨基酸：氨基酸的结构通式；氨基酸的分类；氨基酸的三字符号，一字符号，等电点；氨基酸的理化性质。", "3.氨基酸的连接：肽键；肽；多肽链；N末端和C末端；多肽链的方向性；氨基酸残基，蛋白质。", "4.重要的活性多肽：谷胱甘肽的结构与功能；多肽类激素和神经肽的结构与功能。", "5.蛋白质的分子结构：1.蛋白质的一级结构：定义、结构特点；2.蛋白质的二级结构：定义；肽单元；二级结构的主要类型及结构特点；超二级结构及模体；3.蛋白质的三级结构：定义、稳定力、结构域；4.蛋白质的四级结构：定义、稳定力。", "6.蛋白质的分类。", "7.蛋白质结构与功能的关系：蛋白质一级结构与功能的关系；蛋白质空间结构与功能的关系。", "8.蛋白质的理化性质：蛋白质的两性电离性质；蛋白质的胶体性质；蛋白质变性与复性；蛋白质的紫外吸收；蛋白质的呈色反应。", "9.蛋白质分离纯化与结构分析。"]}, {"title": "第五章 核酸的化学", "items": ["1.核苷酸是核酸的基本组成单位：碱基、核糖、脱氧核糖、核苷、脱氧核苷、核苷酸、脱氧核苷酸的结构。", "2.核酸的一级结构：核苷酸的连接方式：3’,5’-磷酸二酯键；核酸链的方向性；核酸一级结构的定义；一级结构的书写方式。", "3.DNA的二级结构：B型DNA的结构特点；DNA二级结构的多样性。", "4.DNA的超螺旋结构及其在染色质中的组装。", "5.DNA的功能：DNA是遗传信息的物质基础。", "6.RNA的种类及功能。", "7.信使RNA的结构与功能。", "8.转运RNA的结构与功能。", "9.核蛋白体RNA的结构与功能。", "10.核酸的理化性质：核酸的紫外吸收；核酸的变性与复性；核酸分子杂交。"]}, {"title": "第六章 酶", "items": ["1.酶概念。", "2.酶的分子组成：单纯酶，结合酶的概念；全酶、酶蛋白、辅助因子的概念；金属离子的功能；辅酶或辅基的概念及功能；B族维生素与辅酶的关系。", "3.酶的活性中心：定义；必需基团、结合基团、催化基团、活性中心外的必需基团的概念和功能。", "4.同工酶：概念，生理意义，医学应用。", "5.酶促反应的特点：高效性，特异性，可调节性，不稳定性。", "6.酶促反应的机制：能显著降低反应活化能。", "7.酶催化反应的化学原理：诱导契合学说；中间复合物学说；酶催化反应的一些化学机制。", "8.酶促反应动力学：（1）底物浓度对反应速度的影响：米氏方程式、Km与Vm的意义；（2）酶浓度对反应速度的影响；（3）温度对反应速度的影响；（4）pH对反应速度的影响；（5）抑制剂对反应速度的影响：不可逆性抑制作用、可逆性抑制作用的概念。可逆性抑制作用：竞争性抑制的定义、对Km和Vm的影响；非竞争性抑制的定义、对Km和Vm的影响；反竞争性抑制的定义、对Km和Vm的影响；酶竞争性抑制在医学上的应用：磺胺类药物的作用机理。（6）激活剂对反应速度的影响。", "9.酶的调节：（1）酶的别构调节；（2）酶的共价修饰调节；（3）酶原与酶原的激活；（4）酶含量的调节。", "10.酶的分类与命名。"]}, {"title": "第七章 生物氧化", "items": ["1.生物氧化的概念及特点。", "2.呼吸链：呼吸链的概念；呼吸链中各成员的结构与功能；呼吸链的组成：NADH和FADH2这两条重要呼吸链的排列顺序。", "3.氧化磷酸化和底物水平磷酸化：（1）氧化磷酸化和底物水平磷酸化的概念；磷氧比值；氧化磷酸化的偶联部位；（2）氧化磷酸化偶联机制：化学渗透假说；（3）ATP合酶的结构与作用机理；（4）ATP在能量代谢中的核心作用：高能键、高能化合物的概念；ATP的生成、储存和利用。", "4.影响氧化磷酸化的因素：体内能量状态对氧化磷酸化的调节作用；常见抑制剂的抑制作用；甲状腺素的调节作用；线粒体DNA突变对氧化磷酸化的影响。", "5.通过线粒体内膜的物质转运：胞浆中NADH的氧化：-磷酸甘油穿梭和苹果酸-天冬氨酸穿梭作用的生理意义；腺苷酸转运蛋白；线粒体蛋白质的跨膜转运。", "6.非线粒体氧化体系：微粒体氧化体系、过氧化物酶体氧化体系和超氧化物歧化酶。"]}, {"title": "第八章 糖代谢", "items": ["1.糖的生理功能；糖的消化、吸收与转运；糖代谢的概况。", "2.糖的无氧氧化：（1）糖无氧氧化（糖酵解）的定义；（2）糖无氧氧化的基本过程：糖酵解反应过程中ATP的生成和关键酶；（3）糖酵解的调节；（4）糖酵解的生理意义；（5）其他单糖的代谢。", "3.糖的有氧氧化：定义，基本过程，糖有氧氧化的生理意义，生成ATP数量的计算，有氧氧化的调节，巴斯德效应。", "4.三羧酸循环：定义，详细过程，关键酶及脱氢辅酶，三羧酸循环的特点及生理意义。", "5.磷酸戊糖途径：定义，基本过程，关键酶，磷酸戊糖途径的调节，磷酸戊糖途径的生理意义。", "6.糖原的合成与分解：定义，基本过程，关键酶，糖原合成与分解的调节。", "7.糖异生途径：（1）糖异生途径：定义，基本过程，关键酶，糖异生的调节，糖异生的生理意义；（2）乳酸循环：定义，基本过程，生理意义；（3）葡萄糖的其他代谢途径：葡萄糖醛酸途径，多元醇途径，2,3-二磷酸甘油酸旁路。", "8.血糖及其调节：（1）血糖的来源和去路；（2）血糖水平的激素调节：胰岛素作用的机理，胰高血糖素的作用机理；（3）血糖水平异常。"]}, {"title": "第九章 脂类代谢", "items": ["1.脂质的化学：脂质的概念，分类，化学结构及主要功能，必需脂肪酸。", "2.脂质的消化、吸收。", "3.甘油三脂代谢：（1）甘油三脂的合成代谢：合成原料来源，基本过程，关键酶；（2）甘油三酯的分解代谢：①脂肪的动员；②甘油分解代谢的基本过程；③脂肪酸分解的基本过程：脂肪酸的激活，肉碱的穿梭作用，β-氧化的基本过程；④饱和脂肪酸氧化过程中ATP生成数量的计算；⑤酮体的生成与利用：酮体的定义，代谢的基本过程，代谢特点，关键酶，生理意义。", "4.磷脂的代谢：（1）甘油磷脂的代谢：甘油磷脂的组成、分类及结构；甘油磷脂的合成及降解。（2）鞘磷脂的代谢：鞘磷脂的化学组成及结构；鞘磷脂的代谢。", "5.胆固醇代谢：（1）胆固醇的合成：合成部位，合成原料，合成的基本过程，关键酶，合成的调节；（2）胆固醇的转化。", "6.血浆脂蛋白代谢：（1）血脂的概念；（2）血浆脂蛋白的分类、组成及结构；（3）载脂蛋白的定义和功能；（4）血浆脂蛋白代谢：血浆脂蛋白代谢过程，血浆脂蛋白的主要功能；（5）血浆脂蛋白代谢异常。", "7.类二十烷酸生物合成。"]}, {"title": "第十章 蛋白质的分解代谢", "items": ["1.蛋白质的生理功能。", "2.蛋白质的营养价值：（1）机体蛋白质营养状况的评价：氮平衡；（2）食物蛋白质营养价值评价：蛋白质的总量及必需氨基酸的种类和比例。", "3.蛋白质的消化、吸收与腐败作用。", "4.氨基酸的一般代谢：（1）体内蛋白质的降解；（2）体内氨基酸代谢概况；（3）氨基酸的脱氨基作用：①转氨基作用：定义，反应通式，维生素B6的作用，生理意义；②L-谷氨酸氧化脱氨基作用：定义，反应式，生理意义；③联合脱氨基作用：定义，主要方式，基本过程，生理意义；④氨基酸的其他脱氨基方式。（4）酮酸的代谢。", "5.氨的代谢：（1）血氨的来源；（2）氨的转运：丙氨酸-葡萄糖循环；谷氨酰胺的运氨作用；（3）尿素的生成：①尿素循环的定义；②尿素的合成：合成的基本过程，关键酶，尿素循环的特点；③尿素合成的调节；④高血氨症和氨中毒。", "6.个别氨基酸的代谢：（1）氨基酸脱羧基作用：生理活性物质的生成和作用；（2）一碳单位的代谢：概念，载体，一碳单位的来源和互变，生理意义；（3）含硫氨基酸的代谢：甲硫氨酸循环；（4）芳香族氨基酸的代谢。（5）支链氨基酸的代谢。"]}, {"title": "第十一章 核酸的代谢", "items": ["1.核苷酸的消化、吸收。", "2.核苷酸的生物功能。", "3.嘌呤核苷酸的合成代谢：（1）从头合成途径：概念，原料的来源；（2）补救途径：概念，反应过程；（3）脱氧核苷酸的生成；（4）.嘌呤核苷酸抗代谢物。", "4.嘧啶核苷酸的合成代谢：（1）从头合成途径：概念，原料的来源；（2）补救途径：概念，反应的基本过程；（3）嘧啶核苷酸抗代谢物。", "5.嘌呤核苷酸的分解代谢：分解的基本过程；分解终产物：尿酸。", "6.嘧啶核苷酸的分解代谢：分解的基本过程，分解终产物。"]}, {"title": "第十二章 代谢及代谢调控", "items": ["1.物质代谢的特点。", "2.物质代谢的相互关系：各种能量物质的代谢相互联系相互制约；糖、脂和蛋白质代谢通过中间代谢物而相互联系。", "3.组织、器官的代谢特点及联系。", "4.物质代谢调节：（1）细胞水平的代谢调节：细胞内酶的隔离分布；关键酶的概念；关键酶的变构调节及变构调节的特点；酶的化学修饰调节及其调节特点；酶量的调节。（2）激素水平的代谢调节。（3）整体调节。"]}, {"title": "第十三章 DNA 的生物合成", "items": ["1.遗传学的中心学法则。", "2.复制的基本规律：（1）半保留复制：概念，生物学意义。（2）双向复制：概念；复制起始点、复制叉、复制子的概念。（3）复制的半不连续性：概念；领头链、随从链、冈崎片段的概念；（4）DNA的合成方向。", "3.DNA复制的酶学和拓扑学变化：（1）复制的化学反应：合成DNA的基本条件；（2）DNA聚合酶：原核生物DNA聚合酶的主要类型，结构及功能；真核生物DNA聚合酶的主要类型及功能；（3）复制保真性的酶学依据；（4）复制中的解链和DNA分子拓扑学变化：解螺旋酶、单链DNA结合蛋白、引物酶、拓扑异构酶I、拓扑异构酶II的功能；（5）.DNA连接酶：功能。", "4.DNA生物合成过程：（1）原核生物的DNA生物合成：基本过程；（2）真核生物的DNA生物合成：基本过程。端粒的概念，组成，作用原理，生物学意义。", "5.逆转录和其他复制方式：（1）逆转录病毒和逆转录酶：逆转录的概念；（2）逆转录研究的意义；（3）滚环复制和D环复制。", "6.DNA损伤：DNA损伤、突变的概念；引发突变的因素；DNA损伤的主要类型。", "7.DNA损伤的修复：DNA损伤修复的主要类型及其机制。", "8.DNA损伤和修复的意义。", "9.基因突变与基因多态性。"]}, {"title": "第十四章 RNA 生物合成", "items": ["1.转录的概念；转录和复制的异同点。", "2.原核生物转录的模板与酶：（1）不对称转录、结构基因、模板链、编码链的概念；模板链、编码链、转录产物、蛋白质肽链间的关系。（2）原核RNA聚合酶：RNA聚合酶的结构及各亚基的功能。（3）模板与酶的辨认结合：启动子的概念。", "3.原核生物转录过程：基本过程。", "4.真核生物的转录过程：真核生物RNA聚合酶的分类及功能；转录因子的概念及其功能；转录过程的一些特点。", "5.真核生物转录后加工：（1）mRNA转录后加工：添加“帽子”、“尾巴”结构；断裂基因的剪接；mRNA编辑：概念，生物学意义。（2）rRNA的转录后加工：剪切；与蛋白质装配为核糖体。（3）tRNA的转录后加工：添加“氨基酸臂”；核苷酸的修饰；剪切和剪接。", "6.RNA催化的自剪接作用。", "7.RNA在细胞内的降解。", "8.基因转录调控。"]}, {"title": "第十五章 蛋白质的生物合成", "items": ["1.蛋白质生物合成体系的组成。", "2.mRNA在蛋白质合成中的作用：mRNA是蛋白质生物合成的信息模板。遗传密码子的概念；密码子的特点：方向性、连续性、简并性、摆动性、通用性。起始密码子，终止密码子，开放阅读框的概念。", "3.tRNA在蛋白质合成中的作用：tRNA是蛋白质合成时氨基酸的运载工具。", "4.核糖体在蛋白质合成中的作用：核糖体是蛋白质生物合成的场所。核蛋白体的基本结构。", "5.蛋白质生物合成需要的酶类和蛋白质因子。", "6.氨基酸与tRNA的连接：氨基酰-tRNA合成酶的功能及翻译的保真性；特殊的起始氨基酰-tRNA：结构与功能。", "7.蛋白质生物合成过程：蛋白质生物合成的基本过程。", "8.蛋白质合成后加工和输送：（1）多肽链折叠为天然功能构象的蛋白质：分子伴侣的功能；（2）一级结构的修饰：肽链N-端和C-端的切除和化学修饰；氨基酸残基的化学修饰；水解加工生成活性蛋白质或多肽；（3）空间结构的修饰：亚基的聚合；辅基的连接；（4）蛋白质合成后的靶向输送：信号序列的作用；分泌型蛋白分泌蛋白质的基本过程。", "9.蛋白质生物合成的干扰和抑制：（1）抗生素类抑制蛋白质的合成的机理；（2）其他干扰蛋白质合成的物质的作用机理。"]}];

['carbChem','糖的化学、多糖与应用','一.1—3','糖是多羟基醛/酮及其衍生物，常按单糖、寡糖、多糖分组。淀粉/糖原以α-糖苷键储能；纤维素β-1,4键构成结构，人无纤维素酶；糖胺聚糖具重复二糖结构，参与基质与结合水。肝素抗凝、透明质酸用于黏弹/保水体现结构-功能应用。','辨别糖苷键、分支和功能；不把所有多糖都当人体供能物质。'],
['lipidChem','脂类化学、分析与应用','二.1—5','脂类疏水或两亲；单纯脂包括酰基甘油和蜡，复合脂包括磷脂/糖脂；胆固醇属不皂化脂类。甘油酯具酯键，磷脂有极性头基。常用有机溶剂提取，薄层/柱色谱分离，脂肪酸衍生化后气相色谱分析。脂质可作营养、药物成分和脂质体载体。','按结构解释储能、膜形成与药物递送；提取与鉴定不是同一步。'],
['vitamins','维生素与辅酶','三.1—3、六.2','维生素是少量必需的有机营养素，通常不作主体能源。脂溶：A视觉/分化、D钙磷、E抗氧化、K凝血蛋白γ-羧化。水溶：B₁→TPP，B₂→FMN/FAD，B₃/PP→NAD(P)，B₅→CoA，B₆→PLP，B₇→生物素，B₉→THF，B₁₂→钴胺素辅酶；C参与羟化/还原。','辅酶/辅基是参与催化的非蛋白成分；不是每一种维生素都是辅酶。'],
['proteinChem','氨基酸、肽与蛋白质组成','四.1—3','蛋白质常含C/H/O/N/S，平均含氮16%，估算蛋白量=氮量×6.25。α-氨基酸通式NH₂-CH(R)-COOH（生理pH多为两性离子）。肽键连接α-羧基与α-氨基；残基按N→C书写。pI是净电荷为0时pH；pH<pI带净正电，pH>pI带净负电。','pI不是“不含电荷”；含氮16%是平均估算。可用参与中性形式两侧的pKa均值估算pI。'],
['aaCodes','20种常见氨基酸符号与分类','四.2','Gly G 甘；Ala A 丙；Val V 缬；Leu L 亮；Ile I 异亮；Pro P 脯；Phe F 苯丙；Trp W 色；Met M 甲硫；Ser S 丝；Thr T 苏；Cys C 半胱；Tyr Y 酪；Asn N 天冬酰胺；Gln Q 谷氨酰胺；Asp D 天冬；Glu E 谷；Lys K 赖；Arg R 精；His H 组。酸性D/E，碱性K/R/H；分类可按侧链极性、芳香性或营养需要。','Gly无手性中心；Pro为环状二级胺；芳香族在紫外吸收中的贡献不同。'],
['peptides','活性多肽与谷胱甘肽','四.4','谷胱甘肽为γ-谷氨酰-半胱氨酰-甘氨酸，含Cys巯基；GSH参与过氧化物清除，GSSG由NADPH依赖还原酶再生。胰岛素、胰高血糖素为肽类激素；脑啡肽等神经肽通过受体传递信号。','GSH第一条酰胺键用Glu的γ-羧基，不是通常α-羧基。'],
['proteinStructure','蛋白质结构、分类与功能','四.5—7','一级：残基顺序；二级：局部主链构象（α螺旋、β折叠、β转角等），由主链氢键稳定；肽单元近共平面。模体由若干二级结构组合；三级：一条链整体折叠、可含结构域；四级：多亚基组装。稳定作用包括疏水、氢键、离子、范德华及二硫键。可按组成分单纯/结合、形状分纤维/球状等。','序列影响折叠，构象决定功能；结构域可相对独立折叠，模体未必。'],
['proteinProperties','蛋白质理化性质与分析','四.8—9','两性电离与水化膜/表面电荷影响溶解和胶体稳定；变性破坏高级结构，一般不水解肽键，条件适合可复性。280 nm吸收主要来自Trp/Tyr；双缩脲反应检测肽键。盐析、透析、凝胶过滤、离子交换、亲和层析、电泳用于分离；测序和质谱分析一级结构，X射线/NMR等研究构象。','凝胶过滤大分子先出；离子交换看电荷；变性≠降解。'],
['nucleicChem','核酸化学与结构','五.1—5','碱基+戊糖为核苷，再加磷酸为核苷酸；RNA核糖有2′-OH，DNA为2′-H。3′,5′磷酸二酯键构成有方向主链，按5′→3′写序列。B-DNA为右手反平行双螺旋，A-T两氢键、G-C三氢键，常用约10 bp/圈简化（精确值受条件影响）；还存在A/Z等构象。DNA绕组蛋白八聚体形成核小体并进一步组装染色质。','互补、反平行和碱基堆积共同解释遗传信息保存与复制；超螺旋为更高层拓扑。'],
['nucleicProperties','核酸理化性质与RNA类型','五.6—10','核酸约260 nm吸收；双链变性发生增色效应，复性取决于互补序列与条件；杂交利用互补配对检测序列。mRNA传信息，tRNA为适配体，rRNA构成核糖体并催化，其他小RNA参与加工和调控。','核酸变性一般是双链分开，不是主链磷酸二酯键水解；Tm受GC含量和离子强度影响。'],
['enzymeBasics','酶的组成、活性中心与催化','六.1—3、六.5—7','酶是生物催化剂，多数为蛋白、少数为RNA。单纯酶仅蛋白；结合酶的全酶=酶蛋白+辅助因子（金属、辅酶/辅基）。活性中心包含结合/催化基团，中心外也可有维持构象的必需基团。酶形成ES并诱导契合，以邻近定向、酸碱、共价、金属催化等稳定过渡态、降低活化能。','不改变反应ΔG和平衡常数；高效、特异、可调且易受环境影响。辅基结合较紧，辅酶通常较松。'],
['isoenzyme','同工酶、调节及分类命名','六.4、六.9—10','同工酶催化同一反应而分子结构/理化性质不同，如LDH不同亚基组合，分布差异有助了解组织损伤。别构效应物改变构象；可逆共价修饰调活性；酶原经特异水解激活；酶量受合成/降解控制。传统六类：氧化还原、转移、水解、裂合、异构、连接；现代EC另列转位酶为第七类。','考纲未指定分类版次口径：传统六类须熟悉，第七类标为现代分类辅助理解；酶原激活通常不可逆，不能等同于可逆磷酸化。'],
['enzymeEnv','温度、pH、激活与不可逆抑制','六.8','升温先加快反应，过高可使酶失活；“最适温度”受测定时长等影响。pH改变活性基团电离及结构；激活剂如某些金属离子可促进活性。可逆抑制可随去除抑制剂恢复；不可逆抑制常共价修饰或极牢固结合必需基团。','只有底物饱和且其他条件固定时，速度与活性酶量成比例；别用一张通用钟形曲线代表所有酶。'],
['bioOx','生物氧化与磷氧比','七.1、七.3','生物氧化是在细胞内进行的氧化还原，常以脱氢、递电子逐级释放能量。P/O通常表示每还原一个氧原子（½O₂）所合成ATP数。底物水平磷酸化直接从高转移势底物向ADP/GDP转磷酸；氧化磷酸化依赖呼吸链-质子梯度。','考纲未给定P/O值；现代常用NADH≈2.5、FAD相关入口≈1.5，传统练习3/2必须独立注明。']
];foundations.forEach(([id,n,ref,act,mem])=>add(id,n,'','coverage',ref,n+'的考纲梳理。','见具体过程',act,mem));

function svgNode(id,x,y,w=152,text,sub,highlight=false){const k=KB[id];return `<g role="button" tabindex="0" aria-label="${esc(k?.name||text)}" data-k="${id}" class="svg-node ${k?.core?'core':'aux'} ${state.selected===id?'selected':''}"><rect x="${x-w/2}" y="${y-26}" width="${w}" height="52" rx="8" fill="${highlight?'#25534e':'#20353e'}" stroke="${highlight?'#7adbc4':'#3b5560'}"/><text text-anchor="middle" x="${x}" y="${y+ (sub?-2:5)}" class="glabel">${label(text||k?.name,id,true)}</text>${sub?`<text text-anchor="middle" x="${x}" y="${y+16}" class="gsub">${esc(sub)}</text>`:''}</g>`}
function edgePath(a,b,i){if(a==='acyl'&&b==='tag')return 'M200 356 C238 356,238 69,200 69';if(a==='glycerol'&&b==='tag')return 'M155 133Q190 113 155 97';if(i===1)return 'M40 69 C12 69,12 264,40 264';let [x1,y1]=pos(a),[x2,y2]=pos(b);let dx=x2-x1,dy=y2-y1;if(Math.abs(dx)>Math.abs(dy)){x1+=Math.sign(dx)*79;x2-=Math.sign(dx)*79}else{y1+=Math.sign(dy)*28;y2-=Math.sign(dy)*28}let bend=([5,7,10,12,14,15,29,30,31].includes(i)?55:0);return `M${x1} ${y1} Q${(x1+x2)/2+bend} ${(y1+y2)/2-bend} ${x2} ${y2}`;}
function renderMap(){const filters=[['all','全部'],['sugar','糖代谢'],['lipid','脂质'],['aa','氨基酸'],['nucleotide','核苷酸'],['energy','能量']];let nodesIn=new Set();edges.forEach(e=>{if(state.filter==='all'||e[3]===state.filter){nodesIn.add(e[0]);nodesIn.add(e[1]);}});let svg=defs+`<text x="40" y="30" class="sectionlabel">脂质与储能</text><text x="360" y="30" class="sectionlabel">糖代谢与共同枢纽</text><text x="865" y="30" class="sectionlabel">氮与核苷酸</text><ellipse cx="470" cy="502" rx="226" ry="108" fill="#263943" opacity=".6"/><text x="472" y="505" text-anchor="middle" fill="#69838e" font-size="25">TCA</text>`;

 svg+=`<text x="780" y="154" class="pathlabel">PPP</text><text x="530" y="230" class="pathlabel">糖酵解</text><text x="249" y="367" class="pathlabel">β氧化</text><text x="865" y="525" class="pathlabel">氧化磷酸化</text><text x="985" y="514" class="pathlabel">尿素循环</text><text x="670" y="507" class="pathlabel">还原当量 →</text>`;mapNodes.forEach(([id,x,y,c])=>{const idx=state.path?pathLists[state.path].indexOf(id):-1;const hot=idx>=0&&idx<=state.pathStep;let dim=!nodesIn.has(id)||(state.path&&idx<0)||(state.selected&&edges.some(e=>e[2]===state.selected)&&!edges.some(e=>e[2]===state.selected&&(e[0]===id||e[1]===id)));svg+=`<g class="${dim?'dim':''}">${svgNode(id,x,y,id==='glycogen'?175:160,({glycogen:'糖原',etc:'呼吸链',prpp:'PRPP',chol:'胆固醇',tag:'三酰甘油',acetyl:'乙酰CoA'}[id]),id==='acetyl'?'糖 · 脂 · 氨基酸交点':null,hot)}</g>`;});

function pathNarrative(id){const notes={glucose:'葡萄糖进入胞质，先消耗ATP完成磷酸化。',g6p:'G6P也可分流至糖原或PPP；当前追踪氧化供能。',fatty:'脂肪酸先活化，不能直接进入β氧化。',acyl:'长链脂酰基经肉碱穿梭进入基质；β氧化产生乙酰CoA及还原当量。',pyruvate:'糖酵解净得2 ATP、2 NADH；丙酮酸转运入线粒体。',acetyl:'乙酰CoA与草酰乙酸缩合进入TCA；这里连接糖与脂肪分解。',citrate:'TCA开始；本追踪简写了其余中间步骤，可在糖代谢模块逐步查看。',akg:'氧化脱羧释放CO₂，并把电子交给NAD⁺。',succinyl:'硫酯键的转移势可用于底物水平磷酸化生成GTP。',oaa:'OAA再生完成循环；接下来追踪还原当量，不是OAA转成呼吸链。',etc:'NADH及FAD酶电子进入呼吸链，质子梯度耦联合成ATP。',atp:'到达ATP；数量取决于底物、穿梭和P/O口径。'};return notes[id]||'';}

function renderCoverage(){return `<div class="coverage"><p>原考纲分15章。下列条目按原始编号保留，点击“关联知识”或展开章节进入学习；章节里的概括条目可能对应多个知识卡。<b>这里只核查是否有对应学习入口，不代表已达到考试掌握程度。</b></p><div class="notice">主画布聚焦第六至十五章；第一至五章及不宜展开动画的细项收在这里。点名的小知识可直接搜索，例如“多元醇”“D环”“亚基”“RNA编辑”。</div>${outline.map((ch,idx)=>`<details ${idx===7?'open':''}><summary>${esc(ch.title)} <span class="pill">${ch.items.length} 条</span></summary>${ch.items.map((it,i)=>{const ids=coverageLinks[idx]?.[i]||[];return `<div class="item"><div><p>${esc(it)}</p><div class="chips">${ids.map(id=>kbbtn(id)).join('')}</div></div><small>关联知识<br>${ids.length} 项</small></div>`}).join('')}</details>`).join('')}<details><summary>所有知识索引 · ${Object.keys(KB).length} 项</summary><div class="chips">${Object.values(KB).map(k=>kbbtn(k.id)).join('')}</div></details></div>`;}

function renderAbout(){return `<div class="coverage reading"><h2>一些小介绍~</h2><p>采用结构—功能、代谢—调控与遗传信息流的现代生化框架，并以第9版作为参考方向。<b></b></p><p>第9版书目信息：姚文兵，人民卫生出版社，2022年，ISBN 9787117332293。<a href="https://www.pmphmall.com/gdsdetail/645867-323464" target="_blank" rel="noopener">人卫官方书目</a>。</p><h3>怎么学习</h3><ol><li>地图中点节点看来源/去路，点连线或通路按钮突出整条关系。</li><li>糖代谢与中心法则支持播放、暂停、前后单步和速度选择。切换模块自动停止播放。</li><li>酶动力学滑杆实时计算；浅色参考曲线保留便于比较，实线突出所选机制。</li><li>自测可全部隐藏、揭晓或随机遮罩。点击遮罩先揭晓，之后再点元素查看详情。知识面板的解释也可遮罩。</li><li>搜索结果会转到相应模块；补充抽屉保留原考纲条目和对应知识卡。</li></ol><h3>计算与科学约定</h3><ul><li>糖酵解按1葡萄糖计；TCA按1乙酰CoA计。到乳酸不净生成NADH。</li><li>考纲未指定P/O值，计算器的现代2.5/1.5与传统3/2口径分开。考试以指定教材与授课口径为准。</li><li>非竞争性抑制使用传统纯型。Km不普遍等于底物解离常数。</li><li>总地图箭头表示宏观通路，不表示每条线都是单个反应、自由跨膜或一步可逆。</li><li>动画是非比例二维机制图；原核/真核差异在知识面板逐项说明。</li></ul><p>机制交叉核对参考：<a href="https://www.ncbi.nlm.nih.gov/books/NBK92001/" target="_blank" rel="noopener">Assay Guidance Manual：抑制类型</a>、<a href="https://www.ncbi.nlm.nih.gov/books/NBK26850/" target="_blank" rel="noopener">Molecular Biology of the Cell：DNA复制机制</a>。外部资料用于科学复核，不扩大考试范围。</p><h3>注意</h3><p>这份页面是理解与主动回忆工具；原考纲中的“详细过程”仍建议用指定教材逐反应复习。范围入口覆盖与深入掌握是两件事。</p></div>`;}
